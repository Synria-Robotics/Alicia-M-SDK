[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alicia_m_sdk"
version = "1.0.0"
description = "Python SDK for controlling the Alicia M robotic arm."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Synria Robotics", email = "support@synriarobotics.ai"}
]
keywords = ["robotics", "robotic-arm", "alicia-m", "sdk", "serial-communication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

dependencies = [
    "pyserial>=3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "websockets==13.1",
    "pythoncrc",
    "pycrc",
    "synria-robocore @ git+https://github.com/Synria-Robotics/RoboCore.git@v2.0.1-dev",
    "synriard @ git+https://github.com/Synria-Robotics/Synria-Robot-Descriptions.git", 
]

[project.urls]
Homepage = "https://github.com/Synria-Robotics/Alicia-M-SDK"

[tool.setuptools]
# Automatically find all packages and subpackages
packages = {find = {}}
# Include package data (same as original setup.py)
include-package-data = true
