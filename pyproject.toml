[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alicia_m_sdk"
version = "1.1.1rc1"
description = "Python SDK for controlling the Alicia M robotic arm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Synria Robotics", email = "support@synriarobotics.ai"}
]
keywords = ["robotics", "robotic-arm", "alicia-m", "sdk", "serial-communication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

dependencies = [
    "pyserial>=3.0",
    "numpy>=1.21.0",
    "synria-robocore[torch]>=2.5.0rc3,<3.0",
    "synriard>=1.2.2,<2.0",
]

[project.optional-dependencies]
planning = [
    "scipy>=1.7.0",
]
visualization = [
    "matplotlib>=3.3.0",
]
sparkvis = [
    "websockets>=13.0",
]
teleop = [
    "alicia_d_sdk",
]
torch = [
    "synria-robocore[torch]>=2.5.0rc3,<3.0",
]
all = [
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "websockets>=13.0",
    "alicia_d_sdk",
]

[project.urls]
Homepage = "https://github.com/Synria-Robotics/Alicia-M-SDK"

[tool.setuptools]
packages = {find = {exclude = ["examples*", "tests*"]}}
include-package-data = true
